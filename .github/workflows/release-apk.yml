name: Release APK

# Builds the signed Android APK and attaches it to a GitHub Release.
#
# Versioning is pipeline-controlled: every build gets
#   Major.Minor.<pipeline build id>     e.g. the 6th build → 0.0.6
# where Major/Minor are pinned in the workflow env below and the patch
# segment is GITHUB_RUN_NUMBER, GitHub's per-workflow build counter.
# Bumping Major or Minor is an edit to this file; the build id always
# comes from the pipeline. A step stamps the version into
# export_presets.cfg at build time (version/name + version/code).
#
# - Push/merge to main → build, create tag vM.m.N on the commit and
#   publish a Release with the APK.
# - Run manually from the Actions tab for a test build (dry_run on by
#   default: artifact upload only, no tag, no Release). Uncheck
#   dry_run to publish that run's version as a Release.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 of the release .keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore password (KS_PASS in keystore.env)
#   ANDROID_KEYSTORE_ALIAS    — keystore alias (KS_USER in keystore.env)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test build only (upload as workflow artifact, never publish)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7.1'
  GODOT_RELEASE: '4.7.1-stable'
  # Bump these by hand to change Major.Minor; the patch segment is the
  # pipeline build id (GITHUB_RUN_NUMBER) and is never set by hand.
  VERSION_MAJOR: '0'
  VERSION_MINOR: '0'

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Major.Minor.<build id>. GITHUB_RUN_NUMBER increments on every
          # run of this workflow (main pushes and manual dispatch share the
          # counter), so each pipeline build gets a fresh patch segment.
          NAME="$VERSION_MAJOR.$VERSION_MINOR.$GITHUB_RUN_NUMBER"
          # Classic major*1e6 + minor*1e3 + patch mapping; stays strictly
          # increasing as long as Major/Minor only ever bump upward.
          CODE=$(( VERSION_MAJOR * 1000000 + VERSION_MINOR * 1000 + GITHUB_RUN_NUMBER ))
          {
            echo "name=$NAME"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Building LeafSweeper $NAME (versionCode $CODE)"

      - name: Configure Godot editor settings (Android SDK / JDK paths)
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          config_version=5

          [export]

          android/android_sdk_path="$ANDROID_HOME"
          android/java_sdk_path="$JAVA_HOME"
          android/shutdown_adb_on_exit=false
          EOF

      - name: Restore Godot export templates cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-templates

      - name: Install Godot mono editor and export templates
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLo godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q godot.zip
          # NB: the binary inside uses a dot before the arch (…_linux.x86_64),
          # unlike the folder name (…_linux_x86_64).
          sudo rm -rf /opt/godot
          sudo mv Godot_v${GODOT_RELEASE}_mono_linux_x86_64 /opt/godot
          sudo ln -sf /opt/godot/Godot_v${GODOT_RELEASE}_mono_linux.x86_64 /usr/local/bin/godot
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ]; then
            curl -fsSLo templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
            mkdir -p ~/.local/share/godot/export_templates
            cd ~/.local/share/godot/export_templates
            unzip -q /tmp/templates.tpz
            mv templates ${GODOT_VERSION}.stable.mono
          fi
          godot --version

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-apk-v1
          restore-keys: gradle-godot-apk-v1

      - name: Stamp version into export presets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i "s/^version\/code=.*/version\/code=$VERSION_CODE/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$VERSION_NAME\"/" export_presets.cfg
          grep -E '^version\/' export_presets.cfg

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Secret ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Export signed APK
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_ALIAS" ] || { echo "Secret ANDROID_KEYSTORE_ALIAS is not set" >&2; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Secret ANDROID_KEYSTORE_PASSWORD is not set" >&2; exit 1; }
          # Import assets first (fresh checkout has no .godot cache), then export.
          # --install-android-build-template fetches the gradle template, which is
          # gitignored in this repo; the keystore env vars make Godot sign the APK.
          mkdir -p build
          godot --headless --path . --import
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore" \
          GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_KEYSTORE_ALIAS" \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            godot --headless --path . --install-android-build-template --export-release Android build/LeafSweeper.apk
          test -f build/LeafSweeper.apk

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/LeafSweeper.apk

      - name: Rename APK and compute checksum
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mv build/LeafSweeper.apk "build/LeafSweeper-$VERSION_NAME.apk"
          (cd build && sha256sum "LeafSweeper-$VERSION_NAME.apk" > SHA256SUMS.txt)
          cat build/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeafSweeper-${{ steps.version.outputs.name }}
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          # The pipeline owns versioning: creating the release also creates
          # the vM.m.N tag on this commit, so no tag is ever pushed by hand.
          # On a rerun the release already exists — overwrite its assets.
          if ! gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "LeafSweeper $VERSION_NAME" \
            --generate-notes \
            build/LeafSweeper-*.apk build/SHA256SUMS.txt; then
            echo "Release $TAG already exists (rerun?) — replacing assets"
            gh release upload "$TAG" --clobber build/LeafSweeper-*.apk build/SHA256SUMS.txt
          fi
